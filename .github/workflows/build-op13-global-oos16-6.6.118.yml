name: Build OP13 Global OOS16 6.6.118 (ReSukiSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      optimize_level:
        description: Compiler optimization level
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      clean_build:
        description: Clean build without restored ccache
        required: true
        type: boolean
        default: false
      debug:
        description: Upload diagnostic artifacts
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-op13-global:
    name: OP13 Global OOS16 6.6.118
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_LOGFILE: ${{ github.workspace }}/ccache.log
      CCACHE_MAXSIZE: 12G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESSION: "true"
      CCACHE_COMPRESSION_LEVEL: "3"
      CCACHE_DIRECT: "true"
      CCACHE_FILE_CLONE: "true"
      CCACHE_INODE_CACHE: "true"
      CCACHE_IS_KERNEL_COMPILING: "true"
      CCACHE_UMASK: "002"
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
      LDCACHE_DIR: ${{ github.workspace }}/.ldcache
    steps:
      - name: Checkout build definitions
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix \
            kmod libdw-dev elfutils pigz
          sudo apt-get clean
          mkdir -p "$CCACHE_DIR" "$LDCACHE_DIR"

      - name: Read fixed OP13 Global configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          echo "json=$(jq -c . configs/oos16/OP13-GLOBAL-6.6.118.json)" >> "$GITHUB_OUTPUT"

      - name: Build OP13 Global kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.config.outputs.json }}
          ksu_type: ReSukiSU
          ksu_branch_or_hash: b0b73beb24341b7029a866005e9578ab58aa2df7
          susfs_commit_hash_or_branch: 069baca65e58557019dbf906e802f518428c5a84
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo "## OP13 Global OOS16 6.6.118"
            echo
            echo "- ReSukiSU: \`${{ steps.build.outputs.ksu_version }}\`"
            echo "- SUSFS: \`${{ steps.build.outputs.susfs_version }}\`"
            echo "- Package: \`${{ steps.build.outputs.zip_name }}\`"
            echo "- SHA-256: \`${{ steps.build.outputs.zip_sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
