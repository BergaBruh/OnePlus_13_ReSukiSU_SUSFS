name: Validate Actions optimization

on:
  push:
    branches:
      - agent/optimize-actions-releases
    paths:
      - .github/workflows/validate-actions-optimization.yml

permissions:
  contents: write

jobs:
  build:
    name: Build Global OOS16 6.6.118 with optimized artifact retention
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_LOGFILE: ${{ github.workspace }}/ccache.log
      CCACHE_MAXSIZE: 12G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESSION: "true"
      CCACHE_COMPRESSION_LEVEL: "3"
      CCACHE_DIRECT: "true"
      CCACHE_FILE_CLONE: "true"
      CCACHE_INODE_CACHE: "true"
      CCACHE_IS_KERNEL_COMPILING: "true"
      CCACHE_UMASK: "002"
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
      LDCACHE_DIR: ${{ github.workspace }}/.ldcache
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix \
            kmod libdw-dev elfutils pigz
          sudo apt-get clean
          mkdir -p "$CCACHE_DIR" "$LDCACHE_DIR"

      - name: Read pinned validation inputs
        id: config
        shell: bash
        run: |
          set -euo pipefail
          config=configs/oos16/OP13-GLOBAL-6.6.118.json
          state=.github/update-state/op13-upstreams.json
          jq -e '.custom_patches == true and .opt == true' "$config" >/dev/null
          echo "json=$(jq -c . "$config")" >> "$GITHUB_OUTPUT"
          echo "resukisu_sha=$(jq -er '.sources.resukisu.sha' "$state")" >> "$GITHUB_OUTPUT"
          echo "susfs_sha=$(jq -er '.sources.susfs.sha' "$state")" >> "$GITHUB_OUTPUT"

      - name: Build validation kernel
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.config.outputs.json }}
          ksu_type: ReSukiSU
          ksu_branch_or_hash: ${{ steps.config.outputs.resukisu_sha }}
          susfs_commit_hash_or_branch: ${{ steps.config.outputs.susfs_sha }}
          optimize_level: O2
          clean: false
          debug: false
          artifact_slug: actions-optimization
          artifact_retention_days: 1
          archive_final_zip: false
          upload_final_zip: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
