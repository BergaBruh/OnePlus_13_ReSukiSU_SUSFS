name: Validate all OP13 variants

on:
  push:
    branches: [agent/optimize-actions-releases]
    paths:
      - .github/workflows/validate-op13-all-variants.yml

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.slug }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: oos15-op13-6-6-30
            config: configs/oos15/OP13-6.6.30.json
          - slug: oos15-op13-cph-6-6-56
            config: configs/oos15/OP13-CPH-6.6.56.json
          - slug: oos15-op13-cph
            config: configs/oos15/OP13-CPH.json
          - slug: oos15-op13-pjz
            config: configs/oos15/OP13-PJZ.json
          - slug: oos16-op13-global-6-6-118
            config: configs/oos16/OP13-GLOBAL-6.6.118.json
          - slug: oos16-op13
            config: configs/oos16/OP13.json

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_LOGFILE: ${{ github.workspace }}/ccache.log
      CCACHE_MAXSIZE: 12G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESSION: "true"
      CCACHE_COMPRESSION_LEVEL: "3"
      CCACHE_DIRECT: "true"
      CCACHE_FILE_CLONE: "true"
      CCACHE_INODE_CACHE: "true"
      CCACHE_IS_KERNEL_COMPILING: "true"
      CCACHE_UMASK: "002"
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v6

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix \
            kmod libdw-dev elfutils pigz
          sudo apt-get clean

      - name: Read pinned build inputs
        id: config
        shell: bash
        env:
          MATRIX_CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          jq -e . "$MATRIX_CONFIG" >/dev/null
          jq -e . .github/update-state/op13-upstreams.json >/dev/null
          echo "json=$(jq -c . "$MATRIX_CONFIG")" >> "$GITHUB_OUTPUT"
          echo "resukisu_sha=$(jq -er '.sources.resukisu.sha' .github/update-state/op13-upstreams.json)" >> "$GITHUB_OUTPUT"
          echo "susfs_sha=$(jq -er '.sources.susfs.sha' .github/update-state/op13-upstreams.json)" >> "$GITHUB_OUTPUT"

      - name: Build and package ${{ matrix.slug }}
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.config.outputs.json }}
          ksu_type: ReSukiSU
          ksu_branch_or_hash: ${{ steps.config.outputs.resukisu_sha }}
          susfs_commit_hash_or_branch: ${{ steps.config.outputs.susfs_sha }}
          optimize_level: O2
          clean: false
          debug: false
          artifact_slug: ${{ matrix.slug }}
          archive_final_zip: false
          upload_final_zip: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged ZIP
        shell: bash
        env:
          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
          ZIP_SHA256: ${{ steps.build.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          zip_path="$(find . -path '*/artifacts/*' -type f -name "$ZIP_NAME" -print -quit)"
          [[ -n "$zip_path" && -f "$zip_path" ]] || {
            echo "::error::Built ZIP not found: $ZIP_NAME"
            exit 1
          }
          [[ "$ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Invalid ZIP digest returned by build action"
            exit 1
          }
          [[ "$(sha256sum "$zip_path" | awk '{print $1}')" == "$ZIP_SHA256" ]] || {
            echo "::error::ZIP digest differs from build action output"
            exit 1
          }
